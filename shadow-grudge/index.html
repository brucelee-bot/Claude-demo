 function beep(f=660,d=0.08,type='sine',g=0.05){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),gn=audioCtx.createGain();o.type=type;o.frequency.value=f;gn.gain.value=g;o.connect(gn);gn.connect(audioCtx.destination);o.start();gn.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}

 function makePointer(delay,nextPause){return{t:-delay,pauseLeft:0,nextPauseAt:nextPause}}
 function resetDynamics(){
  p1=cfg.pauseShadow?makePointer(cfg.delay,200):null;
  p2=cfg.pauseShadow?makePointer(cfg.delay*2,350):null;
  revLeft=0;revFrom=null;stillCt=0;prevS1=null;projs=[];chaser=makeChaser();sootheProg=0;
  cache={s1:null,eff1:null,s2:null};
 }
 function loadLevel(n,showMenu=false){
  cur=n;cfg=LEVELS[n-1];save.lastLevel=n;persist();
  player={x:cfg.startX,y:groundY-44,w:34,h:44,vx:0,vy:0,onGround:false,face:1,walk:0};

  ferryProg=0;ferryX=cfg.ferry?(cfg.ferry.from||cfg.ferry.x||0):0;ferryPrevX=ferryX;ferryY=cfg.ferry?cfg.ferry.yFrom:0;ferryPrevY=ferryY;wsTimer=0;wsFired=false;

  $('winOverlay').classList.remove('show');if(!showMenu)$('menu').classList.remove('show');

 }
 function renderProgress(){
  const ch=chapOf(cur);

   const b=document.createElement('button');b.className='lvlbtn';

 }

 // ================= Helpers =================
 function overlap(a,b){return a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
 function onPlate(e,p){if(!e)return false;return overlap({x:e.x+4,y:e.y+e.h-6,w:e.w-8,h:10},{x:p.x,y:groundY-16,w:p.w,h:18})}
 function plateBy(e,p){return p.only==='shadow'?(e&&e.__shadow?onPlate(e,p):false):onPlate(e,p)}
 function ferryRect(){if(!cfg.ferry)return null;return cfg.ferry.vertical?{x:cfg.ferry.x,y:ferryY,w:cfg.ferry.w,h:cfg.ferry.h}:{x:ferryX,y:cfg.ferry.y,w:cfg.ferry.w,h:cfg.ferry.h}}
 function solids(){
  const s=[{x:0,y:groundY,w:960,h:68},{x:0,y:0,w:10,h:H},{x:950,y:0,w:10,h:H},...cfg.platforms];
  const fr=ferryRect();if(fr)s.push(fr);
  cfg.doors.forEach((d,i)=>{s.push({x:d.x,y:0,w:d.w,h:d.top});const h=(groundY-d.top)*(1-doorsOpen[i]);if(h>4)s.push({x:d.x,y:groundY-h,w:d.w,h:h})});
  return s;
 }
 function physics(e){const s=solids();e.vy+=0.7;if(e.vy>16)e.vy=16;e.x+=e.vx;for(const w of s){if(overlap(e,w)){if(e.vx>0)e.x=w.x-e.w;else if(e.vx<0)e.x=w.x+w.w;e.vx=0}}e.y+=e.vy;e.onGround=false;for(const w of s){if(overlap(e,w)){if(e.vy>0){e.y=w.y-e.h;e.vy=0;e.onGround=true}else if(e.vy<0){e.y=w.y+w.h;e.vy=0}}}if(e.x<10)e.x=10;if(e.x>950-e.w)e.x=950-e.w}
 function shadowAt(delayF){if(history.length<=delayF)return null;const f=history[history.length-1-delayF];return{x:f.x,y:f.y,w:34,h:44,face:f.face,walk:f.walk,__shadow:true}}
 function advancePointer(p){if(!p)return;if(p.pauseLeft>0)p.pauseLeft--;else{p.t++;if(p.t===p.nextPauseAt){p.pauseLeft=30;p.nextPauseAt+=300}}}
 function shadowFromPointer(p){if(!p||p.t<0||p.t>=history.length)return null;const f=history[p.t];return{x:f.x,y:f.y,w:34,h:44,face:f.face,walk:f.walk,__shadow:true}}

   if(d.mode==='and'){d.plates.forEach((pi,k)=>{const on=plateBy(player,cfg.plates[pi])||(cache.eff1&&plateBy(cache.eff1,cfg.plates[pi]))||(cache.s2&&plateBy(cache.s2,cfg.plates[pi]));ctx.fillStyle=on?'#ffd166':'#3a4270';ctx.beginPath();ctx.arc(d.x+10+k*20,d.top-28,7,0,Math.PI*2);ctx.fill()});ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='11px sans-serif';ctx.fillText(doorsLatched[i]?'已锁定开启':'多机关同亮才开',d.x-24,d.top-44)}});
  // plates
  cfg.plates.forEach(p=>{const pressed=plateBy(player,p)||(cache.eff1&&plateBy(cache.eff1,p))||(cache.s2&&plateBy(cache.s2,p));const y=(groundY-10)+(pressed?4:0);ctx.fillStyle=p.only==='shadow'?(pressed?'#ff6b81':'#a03a4a'):(pressed?'#ffd166':'#c9a227');roundRect(p.x,y,p.w,10,6);ctx.fill();ctx.fillStyle='#aeb6d6';ctx.font='bold 12px sans-serif';ctx.fillText(p.label,p.x+Math.max(2,p.w/2-16),y-8);if(p.only==='shadow'){ctx.fillStyle='rgba(255,150,160,.75)';ctx.font='10px sans-serif';ctx.fillText('影子专属',p.x+2,y-22)}});
  // reverse footprint preview
  if(cfg.reverseShadow&&cache.s1&&stillCt>=50&&revLeft===0){ctx.fillStyle='rgba(255,60,60,.55)';ctx.font='16px serif';ctx.fillText('👣',cache.s1.x-cache.s1.face*44,cache.s1.y+40)}
  // guard
  if(enemy){ctx.fillStyle=enemy.stun>0?'#8a5a5a':'#d92b2b';ctx.shadowColor='rgba(255,0,0,.5)';ctx.shadowBlur=12;roundRect(enemy.x,enemy.y,enemy.w,enemy.h-6,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';const look=enemy.dir*4;ctx.beginPath();ctx.arc(enemy.x+12+look,enemy.y+16,4,0,Math.PI*2);ctx.arc(enemy.x+24+look,enemy.y+16,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(enemy.x+12+look,enemy.y+16,2,0,Math.PI*2);ctx.arc(enemy.x+24+look,enemy.y+16,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd7d7';ctx.font='bold 11px sans-serif';ctx.fillText(enemy.stun>0?'😵 被影子撞晕':'守卫',enemy.x-2,enemy.y-10);if(enemy.stun>0){ctx.fillStyle='#ffd166';ctx.font='16px serif';ctx.fillText('✦ ✦',enemy.x+4,enemy.y-22)}}
  // chaser
  if(chaser&&chaser.active){ctx.fillStyle=chaser.stun>0?'#6a5a7a':'#8b2fc9';ctx.shadowColor='rgba(180,60,255,.55)';ctx.shadowBlur=12;roundRect(chaser.x,chaser.y,chaser.w,chaser.h-6,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e9c6ff';ctx.beginPath();ctx.moveTo(chaser.x+6,chaser.y+2);ctx.lineTo(chaser.x+12,chaser.y-8);ctx.lineTo(chaser.x+16,chaser.y+3);ctx.moveTo(chaser.x+22,chaser.y+3);ctx.lineTo(chaser.x+28,chaser.y-8);ctx.lineTo(chaser.x+32,chaser.y+2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(chaser.x+12,chaser.y+18,4,0,Math.PI*2);ctx.arc(chaser.x+25,chaser.y+18,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd7f4';ctx.font='bold 11px sans-serif';ctx.fillText(chaser.stun>0?'😵 被影子断后':'追猎者',chaser.x-4,chaser.y-16)}
  else if(chaser){ctx.fillStyle='rgba(139,47,201,.4)';roundRect(chaser.x,chaser.y,chaser.w,chaser.h-6,9);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px sans-serif';ctx.fillText('沉睡的追猎者',chaser.x-14,chaser.y-10)}
  // shadows
  const s2=cache.s2,eff1=cache.eff1;
  if(s2){drawChar(s2,true,true);ctx.fillStyle='rgba(180,205,255,.9)';ctx.font='12px sans-serif';ctx.fillText(`-${(cfg.delay*2/60).toFixed(1)}s 影子`,s2.x-6,s2.y-10)}
  if(eff1){drawChar(eff1,true,false);ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='12px sans-serif';ctx.fillText(`-${(cfg.delay/60).toFixed(1)}s 影子`,eff1.x-6,eff1.y-10);
   if(cfg.pauseShadow&&p1){if(p1.pauseLeft>0){ctx.font='16px serif';ctx.fillText('💢',eff1.x+8,eff1.y-22)}else if(p1.t>=0&&p1.nextPauseAt-p1.t<=30){ctx.fillStyle='#ffdd55';ctx.font='bold 17px sans-serif';ctx.fillText('!',eff1.x+13,eff1.y-20)}}
   if(shadowMsg&&performance.now()<shadowMsgUntil){ctx.font='13px sans-serif';const w=ctx.measureText(shadowMsg).width+18;const bx=Math.max(8,Math.min(eff1.x+18,W-w-8));ctx.fillStyle='rgba(0,0,0,.8)';roundRect(bx,Math.max(8,eff1.y-48),w,26,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(shadowMsg,bx+9,Math.max(8,eff1.y-48)+18)}}
  else if(state==='playing'&&player){const remain=Math.max(0,cfg.delay/60-(performance.now()-startAt)/1000);ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='bold 13px sans-serif';ctx.fillText(`影子 ${remain.toFixed(1)}s 后出现`,player.x-24,player.y-26)}
  if(player)drawChar(player,false);
  if(player){const prog=Math.min(1,history.length/cfg.delay);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x+17,player.y-16,10,-Math.PI/2,-Math.PI/2+Math.PI*2);ctx.stroke();ctx.strokeStyle=cfg.delay>180?'#ff9a5c':'#ffd166';ctx.beginPath();ctx.arc(player.x+17,player.y-16,10,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);ctx.stroke()}
 }
 function loop(){update();draw();requestAnimationFrame(loop)}
 loadLevel(Math.min(save.lastLevel||1,Math.max(1,Math.min(save.unlocked,LEVELS.length))),true);renderProgress();loop();
})();
</script>
